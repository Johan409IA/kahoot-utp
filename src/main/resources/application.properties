spring.application.name=adaptcode-utp-api

# Conexion a Supabase (Transaction Pooler, puerto 6543, IPv4). Valores por defecto para que
# el boton Run funcione sin configurar nada.
# Se pueden sobreescribir con las env vars ADAPTCODE_DB_URL / ADAPTCODE_DB_USERNAME / ADAPTCODE_DB_PASSWORD.
# prepareThreshold=0: el pooler en modo transaccion no comparte prepared statements de servidor.
# sslmode=require: fuerza conexion cifrada (por defecto el driver usa "prefer" y puede caer a texto plano).
spring.datasource.url=${ADAPTCODE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
spring.datasource.username=${ADAPTCODE_DB_USERNAME:postgres.qxailhejjujmofvermio}
spring.datasource.password=${ADAPTCODE_DB_PASSWORD:YGPd&kh28UErzfA}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool chico: es un pooler compartido, no acapares conexiones.
spring.datasource.hikari.maximum-pool-size=5

# Solo para desarrollo local; los esquemas publicados requieren migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seguridad JWT (cambiar jwt.secret en entornos publicados; mínimo 32 caracteres).
jwt.secret=ba568d85c8b7f989c4e5bd1c5fe85e42
jwt.expiration=3600000
jwt.emitter=adaptcode-utp-api

# Códigos de verificación y recuperación (en minutos).
seguridad.codigo-expiracion-minutos=30