spring.application.name=adaptcode-utp-api

spring.datasource.url=jdbc:postgresql://localhost:5433/adaptcode_utp
spring.datasource.username=${ADAPTCODE_DB_USERNAME}
spring.datasource.password=${ADAPTCODE_DB_PASSWORD}

# Solo para desarrollo local; los esquemas publicados requieren migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
